<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Kyami India Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c12; --surface:#12151e; --surface-2:#181c28; --border:#242a3a;
    --indigo:#6366f1; --cyan:#22d3ee; --amber:#f5a623; --danger:#f43f5e; --ok:#10b981;
    --text:#e7e9f2; --muted:#8890a6;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; min-width:0;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);overscroll-behavior-y:contain;}
  body{font-family:'Inter',sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3{font-family:'Manrope',sans-serif;margin:0;}
  a{color:inherit;text-decoration:none;}
  button,input,select,textarea{font-family:inherit;font-size:14px;}
  button{cursor:pointer;}
  img,svg{display:block;max-width:100%;}
  p,span,div,td,th,label,h1,h2,h3{overflow-wrap:anywhere;word-break:break-word;}
  input,select,textarea{
    background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:12px 13px;width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--indigo);outline-offset:-1px;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;font-weight:600;}
  .field{margin-bottom:15px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;min-width:0;}

  /* ---------- shell ---------- */
  .shell{max-width:640px;margin:0 auto;padding-bottom:calc(84px + var(--safe-bottom));min-height:100vh;}
  .topbar{
    position:sticky;top:0;z-index:30;background:rgba(10,12,18,.9);backdrop-filter:blur(10px);
    padding:calc(14px + var(--safe-top)) 18px 14px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .topbar .brand{display:flex;align-items:center;gap:9px;min-width:0;}
  .topbar .mk{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;overflow:hidden;
    background:#0a0a0a;
    display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .topbar .mk img, .login-card .mk img{width:100%;height:100%;object-fit:cover;display:block;}
  .topbar h2{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .sub{font-size:11px;color:var(--muted);}
  .icon-btn{
    width:36px;height:36px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;
  }

  .page{padding:18px 16px 10px;position:relative;}
  .page-inner{
    opacity:0;transform:translateY(8px);transition:opacity .28s ease, transform .28s ease;
  }
  .page-inner.in{opacity:1;transform:translateY(0);}

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(15,18,26,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);
    padding:8px 6px calc(8px + var(--safe-bottom));
    display:flex;justify-content:space-around;
    max-width:640px;margin:0 auto;
  }
  .nav-item{
    display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
    color:var(--muted);font-size:10px;padding:6px 4px;border-radius:10px;flex:1;max-width:90px;
  }
  .nav-item .ic{font-size:19px;line-height:1;}
  .nav-item.active{color:var(--cyan);}

  /* ---------- stat cards ---------- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .stat-card .n{font-size:24px;font-family:'Manrope';color:var(--cyan);font-weight:800;}
  .stat-card .l{font-size:11.5px;color:var(--muted);margin-top:3px;}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:11px;
    border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13.5px;font-weight:600;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .btn.danger{background:transparent;color:var(--danger);border-color:var(--danger);}
  .btn.block{width:100%;}
  .btn.small{padding:8px 12px;font-size:12.5px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .fab-add{
    position:fixed;right:calc(18px + (100vw - 640px)/2);bottom:calc(96px + var(--safe-bottom));z-index:35;
    width:52px;height:52px;border-radius:50%;background:var(--indigo);color:#fff;font-size:24px;
    display:flex;align-items:center;justify-content:center;border:none;box-shadow:0 6px 20px rgba(99,102,241,.5);
  }
  @media(max-width:680px){ .fab-add{ right:18px; } }

  /* ---------- section head ---------- */
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
  .section-head h3{font-size:15px;}

  /* ---------- card lists (replaces tables — avoids any horizontal overflow) ---------- */
  .item-card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;
  }
  .item-top{display:flex;gap:11px;align-items:flex-start;}
  .item-thumb{
    width:40px;height:40px;border-radius:10px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .item-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .item-title{font-weight:700;font-size:14.5px;line-height:1.35;}
  .item-meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .badge{display:inline-block;font-size:10px;padding:3px 9px;border-radius:20px;background:var(--surface-2);color:var(--muted);margin-top:6px;margin-right:5px;}
  .badge.pin{background:var(--amber);color:#1a1408;font-weight:700;}
  .item-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .item-actions .btn{flex:1;min-width:70px;}
  .empty-note{color:var(--muted);font-size:13px;padding:34px 16px;text-align:center;}

  .ep-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:11px 0;border-bottom:1px solid var(--border);
  }
  .ep-row:last-child{border-bottom:none;}
  .ep-row .meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .ep-row .acts{display:flex;gap:6px;flex-shrink:0;}

  /* ---------- bottom-sheet modal ---------- */
  .sheet-scrim{
    position:fixed;inset:0;background:rgba(4,5,9,.6);z-index:80;
    opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  .sheet-scrim.open{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:81;max-width:640px;margin:0 auto;
    background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:none;
    max-height:88vh;overflow-y:auto;padding:10px 20px calc(24px + var(--safe-bottom));
    transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .sheet-scrim.open .sheet{transform:translateY(0);}
  .sheet-handle{width:38px;height:4px;background:var(--border);border-radius:4px;margin:8px auto 14px;}
  .sheet h2{font-size:17px;margin-bottom:16px;padding-right:30px;}
  .sheet-close{position:absolute;top:16px;right:18px;color:var(--muted);font-size:22px;line-height:1;}

  .chip-row{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--bg);
    border:1px solid var(--border);padding:7px 12px;border-radius:20px;
  }
  .chip input{width:auto;margin:0;}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;bottom:calc(96px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(6px);
    background:var(--ok);color:#062018;font-weight:700;font-size:13px;
    padding:10px 20px;border-radius:24px;z-index:100;opacity:0;pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.55;}
  textarea.json-box{min-height:180px;font-family:'JetBrains Mono';font-size:11.5px;line-height:1.5;white-space:pre;overflow-wrap:normal;word-break:normal;}
  code{font-family:'JetBrains Mono';font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px;}

  /* ---------- login gate (only shown when Firebase is configured) ---------- */
  .login-screen{
    min-height:100vh;display:none;align-items:center;justify-content:center;padding:24px;
  }
  .login-screen.show{display:flex;}
  .login-card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px 24px;}
  .login-card .mk{
    width:48px;height:48px;border-radius:14px;margin:0 auto 16px;overflow:hidden;
    background:#0a0a0a;
    display:flex;align-items:center;justify-content:center;font-size:24px;
  }
  .login-card h2{text-align:center;font-size:19px;margin-bottom:22px;}
  .login-error{color:var(--danger);font-size:12.5px;margin:-6px 0 14px;min-height:16px;}
  .signout-link{font-size:11.5px;color:var(--muted);}

  /* ---------- thumbnail URL + live preview (series/episode forms) ---------- */
  .thumb-preview{
    width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;margin-top:8px;
    background:var(--bg);border:1px dashed var(--border);
    display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(.97);transition:opacity .25s ease, transform .25s ease;
  }
  .thumb-preview.ready{opacity:1;transform:scale(1);}
  .thumb-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb-preview .ph{color:var(--muted);font-size:12px;text-align:center;padding:10px;}
  .thumb-preview .ph .big{font-size:26px;display:block;margin-bottom:4px;}
</style>
</head>

    <div class="login-error" id="passcodeError"></div>
    <button class="btn primary block" id="passcodeBtn">Unlock</button>
  </div>
</div>

'use strict';

/* =========================================================================
   FIREBASE (optional) — fill in the SAME firebaseConfig you used in
   index.html. Once filled in, this admin panel:
   - requires sign-in (create the admin user once in Firebase Console →
     Authentication → Users → Add user)
   - reads/writes real Firestore data instead of this browser's localStorage,
     so changes show up for every visitor on index.html, not just you.

   Leave apiKey as "YOUR_API_KEY" and this panel keeps working exactly like
   before: no login, no network calls, everything saved to localStorage.
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDVJ8teO-BzMnphpCnJ4OU1_Nt2M-UgmHo",
  authDomain: "kyami-india.firebaseapp.com",
  projectId: "kyami-india",
  storageBucket: "kyami-india.firebasestorage.app",
  messagingSenderId: "319008399850",
  appId: "1:319008399850:web:110053337a15e0a46dd293"
};
const firebaseReady = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db = null, fs = null, auth = null, authMod = null;

async function initFirebase(){
  const [{ initializeApp }, firestoreMod, authModule] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"),
    import("https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js")
  ]);
  fs = firestoreMod; authMod = authModule;
  const fbApp = initializeApp(firebaseConfig);
  db = fs.getFirestore(fbApp);
  auth = authMod.getAuth(fbApp);
}

async function loadAllData(){
  if(!firebaseReady) return ToonHiveData.load();
  const seriesSnap = await fs.getDocs(fs.collection(db,'series'));
  const catalog = seriesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const scheduleSnap = await fs.getDocs(fs.collection(db,'schedule'));
  const schedule = scheduleSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const configSnap = await fs.getDoc(fs.doc(db,'config','adConfig'));
  const adConfig = configSnap.exists() ? configSnap.data() : ToonHiveData.buildDefaultAdConfig();
  return { catalog, schedule, adConfig };
}

async function wipeCollection(name){
  const snap = await fs.getDocs(fs.collection(db,name));
  await Promise.all(snap.docs.map(d => fs.deleteDoc(fs.doc(db,name,d.id))));
}
async function writeFullData(data){
  await wipeCollection('series');
  await wipeCollection('schedule');
  await Promise.all(data.catalog.map(c=>{ const {id, ...rest} = c; return fs.setDoc(fs.doc(db,'series',id), rest); }));
  await Promise.all(data.schedule.map(s=>{ const {id, ...rest} = s; return fs.setDoc(fs.doc(db,'schedule',id), rest); }));
  await fs.setDoc(fs.doc(db,'config','adConfig'), data.adConfig);
}

/* persist(change) — call after mutating the in-memory DATA object.
   `change` tells us the minimum write needed; local (non-Firebase) mode
   just saves the whole DATA blob to localStorage either way. */
async function persist(change){
  change = change || {type:'full'};
  if(!firebaseReady){ ToonHiveData.save(DATA); showToast('Saved'); return; }
  try{
    if(change.type==='series'){
      const c = DATA.catalog.find(x=>x.id===change.id);
      const {id, ...rest} = c;
      await fs.setDoc(fs.doc(db,'series',id), rest);
    } else if(change.type==='deleteSeries'){
      await fs.deleteDoc(fs.doc(db,'series',change.id));
      await Promise.all((change.removedScheduleIds||[]).map(sid => fs.deleteDoc(fs.doc(db,'schedule',sid))));
    } else if(change.type==='schedule'){
      const s = DATA.schedule.find(x=>x.id===change.id);
      const {id, ...rest} = s;
      await fs.setDoc(fs.doc(db,'schedule',id), rest);
    } else if(change.type==='deleteSchedule'){
      await fs.deleteDoc(fs.doc(db,'schedule',change.id));
    } else if(change.type==='ads'){
      await fs.setDoc(fs.doc(db,'config','adConfig'), DATA.adConfig);
    } else {
      await writeFullData(DATA); // 'full' — used by reset & import
    }
    showToast('Saved');
  }catch(e){
    console.error('Firestore save failed:', e);
    showToast('Save failed — check connection/rules');
  }
}
const ToonHiveData = (function(){
  const STORAGE_KEY = 'toonhive_data';
  const PALETTE = ['#0f766e,#134e4a','#7c3aed,#4c1d95','#1e3a5f,#0f172a','#b45309,#78350f'];
  const EMOJI = ['🐝','🍯','🌻','🦋','🍂','🌾','🍄','🌙'];
  const TITLES = [
    'Hollow Meadow Chronicles','The Last Beekeeper','Nectar & Static','Paper Moth Diaries',
    'Rustling Hollow','Static Orchard','The Wandering Hive','Amber Season','Loomwood Tales',
    'Sundown Apiary','Glass Pollen','The Quiet Swarm'
  ];
  const ALT_TITLES=[
    ['Hollow Meadow'], ['Beekeeper Chronicles','TLB'], ['Nectar Static'], ['Moth Diaries'],
    ['Hollow Rustle'], ['Orchard Static'], ['Wandering Hive Tales'], ['Amber Days'],
    ['Loomwood Saga'], ['Sundown Apiary Tales'], ['Pollen Glass'], ['Quiet Swarm Saga']
  ];
  const GENRE_SETS=[['Adventure','Fantasy'],['Slice of Life','Comedy'],['Drama','Original'],['Fantasy','Original']];
  const AUDIO_SETS=['Hindi | English','Hindi | English | Japanese','English | Japanese'];
  const EP_COUNTS=[12,13,24,26];
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul'];
  const LANGS = ['Hindi','Tamil','Telugu','English','Japanese'];
  const DAYS = ['Friday','Saturday','Sunday','Monday'];

  function randomDate(){ return `${MONTHS[Math.floor(Math.random()*MONTHS.length)]} ${Math.ceil(Math.random()*28)}, 2026`; }
  function uid(prefix){ return prefix + Math.random().toString(36).slice(2,9); }

  function buildDefaultCatalog(){
    return TITLES.map((t,i)=>{
      const g = PALETTE[i % PALETTE.length].split(',');
      const epCount = Math.min(EP_COUNTS[i % EP_COUNTS.length], 12);
      return {
        id: 'c'+i, shortTitle: t, altTitles: ALT_TITLES[i].slice(),
        title: t + ' Season 1 — Hindi, English (Multi Audio) Episodes',
        emoji: EMOJI[i % EMOJI.length],
        grad: `linear-gradient(150deg, ${g[0]}, ${g[1]})`,
        date: randomDate(), genres: GENRE_SETS[i % GENRE_SETS.length].slice(),
        audio: AUDIO_SETS[i % AUDIO_SETS.length], episodes: epCount,
        quality: '480p | 720p | 1080p', pinned: i<2,
        lastUpdated: new Date(Date.now() - i*86400000).toISOString(),
        episodesData: Array.from({length: epCount}, (_,n)=>({
          number: n+1, date: randomDate(),
          adNetwork: n % 2 === 0 ? 'adsgram' : 'monetag', url: '#'
        }))
      };
    });
  }
  function buildDefaultSchedule(catalog){
    return catalog.slice(0,4).map((c,i)=>{
      const future = new Date(Date.now() + (i+1)*36*3600*1000 + i*1500000);
      return {
        id: uid('s'), catalogId: c.id, season: 1 + (i % 2), episode: 8 + i,
        activeLang: LANGS[i % LANGS.length], langs: LANGS.slice(0, 2 + (i % 4)),
        day: DAYS[i % DAYS.length], time: (5 + i) % 12 + 1 + ':00 ' + (i % 2 === 0 ? 'PM' : 'AM'),
        nextEpisodeAt: future.toISOString()
      };
    });
  }
  function buildDefaultAdConfig(){ return { adsgramBlockId: 'your-block-id', monetagZoneId: 'XXX' }; }
  function buildDefaults(){
    const catalog = buildDefaultCatalog();
    return { catalog, schedule: buildDefaultSchedule(catalog), adConfig: buildDefaultAdConfig() };
  }
  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && parsed.catalog && parsed.schedule && parsed.adConfig) return parsed;
      }
    }catch(e){ console.warn('ToonHiveData: read failed, using defaults.', e); }
    const defaults = buildDefaults();
    save(defaults);
    return defaults;
  }
  function save(data){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
    catch(e){ console.error('ToonHiveData: save failed.', e); return false; }
  }
  function reset(){ localStorage.removeItem(STORAGE_KEY); return load(); }

  return { STORAGE_KEY, LANGS, DAYS, randomDate, uid, buildDefaultCatalog, buildDefaultSchedule, buildDefaultAdConfig, load, save, reset };
})();

function goToPage(key){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.page===key));
  const wrap = document.getElementById('pageContent');
  const title = document.getElementById('pageTitle');
  const fab = document.getElementById('fabAdd');
  wrap.classList.remove('in');
  setTimeout(()=>{
    title.textContent = pageTitles[key];
    pageRenderers[key]();
    if(fabHandlers[key]){ fab.style.display='flex'; fab.onclick=fabHandlers[key]; }
    else { fab.style.display='none'; }
    requestAnimationFrame(()=>wrap.classList.add('in'));
    window.scrollTo({top:0,behavior:'instant'});
  }, 140);

function saveEpisode(seriesId, existingNumber){
  const c = DATA.catalog.find(x=>x.id===seriesId);
  if(!c.episodesData) c.episodesData = [];
  const number = parseInt(document.getElementById('f_num').value,10);
  const date = document.getElementById('f_date').value.trim();
  const url = document.getElementById('f_url').value.trim() || '#';
  const thumbnail = document.getElementById('f_ep_thumb').value.trim();
  const adNetwork = document.getElementById('f_network').value;
  if(existingNumber){
    const ep = c.episodesData.find(e=>e.number===existingNumber);
    Object.assign(ep, {number, date, url, thumbnail, adNetwork});
  } else {
    c.episodesData.push({number, date, url, thumbnail, adNetwork});
    c.lastUpdated = new Date().toISOString(); // NEW episode -> bumps this series to the top of the home feed
  }
  c.episodesData.sort((a,b)=>a.number-b.number);
  c.episodes = c.episodesData.length;
  persist({type:'series', id:seriesId}); closeSheet(); renderSeries(); manageEpisodes(seriesId);
}
function deleteEpisode(seriesId, number){
  const c = DATA.catalog.find(x=>x.id===seriesId);
  if(!c.episodesData) c.episodesData = [];
  if(!confirm(`Delete Episode ${number}?`)) return;
  c.episodesData = c.episodesData.filter(e=>e.number!==number);
  c.episodes = c.episodesData.length;
  persist({type:'series', id:seriesId}); renderSeries(); manageEpisodes(seriesId);
}

/* ---------- tiny helper to keep injected text from breaking layout/HTML ---------- */
function esc(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* Live thumbnail preview: as the URL input changes, try loading the image
   off-DOM first, then fade it into the preview box — or show a friendly
   "couldn't load" state instead of a broken image icon. */
function wireThumbPreview(inputEl, previewEl, initialUrl){
  function update(url){
    url = (url||'').trim();
    previewEl.classList.remove('ready');
    if(!url){
      previewEl.innerHTML = '<div class="ph"><span class="big">🖼️</span>Paste an image URL above to preview it here</div>';
      return;
    }
    previewEl.innerHTML = '<div class="ph"><span class="big">⏳</span>Loading preview…</div>';
    const img = new Image();
    img.alt = ''; img.loading = 'lazy';
    img.onload = ()=>{
      if(inputEl.value.trim() !== url) return; // input changed again before this one finished loading
      previewEl.innerHTML = '';
      previewEl.appendChild(img);
      requestAnimationFrame(()=> previewEl.classList.add('ready'));
    };
    img.onerror = ()=>{
      if(inputEl.value.trim() !== url) return;
      previewEl.innerHTML = '<div class="ph"><span class="big">⚠️</span>Couldn\'t load that image — check the URL</div>';
    };
    img.src = url;
  }
  let debounceTimer;
  inputEl.addEventListener('input', ()=>{
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(()=> update(inputEl.value), 350);
  });
  if(initialUrl) update(initialUrl);
}

/* ---------- boot ---------- */
async function boot(){
  const loginScreen = document.getElementById('loginScreen');
  const adminShell = document.getElementById('adminShell');
  const bottomNav = document.getElementById('bottomNav');
  const signOutBtn = document.getElementById('signOutBtn');

  if(!firebaseReady){
    adminShell.style.display = '';
    bottomNav.style.display = 'flex';
    DATA = await loadAllData();
    renderDashboard();
    return;
  }

  await initFirebase();

  document.getElementById('loginBtn').onclick = async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try{
      await authMod.signInWithEmailAndPassword(auth, email, pass);
    }catch(e){
      errEl.textContent = 'Sign-in failed — check email and password.';
    }
  };
  signOutBtn.onclick = ()=> authMod.signOut(auth);

  authMod.onAuthStateChanged(auth, async (user)=>{
    if(user){
      loginScreen.classList.remove('show');
      adminShell.style.display = '';
      bottomNav.style.display = 'flex';
      signOutBtn.style.display = 'flex';
      DATA = await loadAllData();
      renderDashboard();
    } else {
      adminShell.style.display = 'none';
      bottomNav.style.display = 'none';
      signOutBtn.style.display = 'none';
      loginScreen.classList.add('show');
    }
  });
}

/* =========================================================================
   PASSCODE GATE — a simple front-door lock that works even before Firebase
   is set up. The passcode itself is never stored in plaintext: only its
   SHA-256 hash lives in this file, and the hash is compared client-side.

   IMPORTANT — read this honestly:
   This is NOT real security. Anyone who opens this file's source / devtools
   can see the hash and could brute-force or intercept the typed passcode.
   It's enough to stop a random visitor from poking around your admin panel,
   but it is NOT a substitute for the Firebase Auth login above, which is
   validated by Firebase's servers, not just your browser. For anything you
   actually care about protecting, set up Firebase (the email/password login
   screen you already have) rather than relying on this alone.

   To change the passcode: replace PASSCODE_HASH with the SHA-256 hex digest
   of your new passcode. You can generate one in any browser console with:
   crypto.subtle.digest('SHA-256', new TextEncoder().encode('yourPasscode'))
     .then(b => console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
   ========================================================================= */
const PASSCODE_HASH = 'd10871facaba3a9750cf4ba634c54bb3b39b24ec9936708d73fdb1dd4120673c';
const PASSCODE_UNLOCK_KEY = 'toonhive_admin_unlocked';

async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function tryPasscode(){
  const input = document.getElementById('passcodeInput');
  const errEl = document.getElementById('passcodeError');
  errEl.textContent = '';
  const hash = await sha256Hex(input.value);
  if(hash === PASSCODE_HASH){
    localStorage.setItem(PASSCODE_UNLOCK_KEY, '1');
    document.getElementById('passcodeScreen').classList.remove('show');
    boot();
  } else {
    errEl.textContent = 'Wrong passcode.';
    input.value = '';
    input.focus();
  }
}

document.getElementById('passcodeBtn').onclick = tryPasscode;
document.getElementById('passcodeInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryPasscode(); });

if(localStorage.getItem(PASSCODE_UNLOCK_KEY) === '1'){
  document.getElementById('passcodeScreen').classList.remove('show');
  boot();
} else {
  document.getElementById('passcodeInput').focus();
}
</script>

</body>
</html>
